[package]
name = "eslnch"
version = "0.1.0"
edition = "2021"
description = "Fast cross-platform app launcher"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
dirs = "5"
serde = { version = "1", features = ["derive"] }
shlex = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
